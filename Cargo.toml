[package]
name = "etl-engine"
version = "0.1.0"
edition = "2024"
description = "JSON pipelines. One Rust binary. Async ETL for Postgres, ClickHouse, and CSV with a live Web UI"
license = "MIT"
repository = "https://github.com/Pixelzzz99/dataflow-rs"
readme = "README.md"
keywords = ["etl", "postgres", "clickhouse", "pipeline", "data"]
categories = ["database", "asynchronous"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }

sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", 'tls-native-tls', 'chrono'] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

async-trait = "0.1"

chrono = { version = "0.4", features = ["serde"] }

log = "0.4"
env_logger = "0.11"

csv = "1"

reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
cron = "0.15"
notify = "6"
rquickjs = "0.6"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
